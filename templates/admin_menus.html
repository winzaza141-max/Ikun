<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการเมนูอาหาร - ข้าวกล่องไอคุน (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<style>/* Animation สำหรับ Skeleton Shimmer */
@keyframes shimmer {
  0% { background-position: -200px 0; }
  100% { background-position: 200px 0; }
}

.skeleton {
  background: #f6f7f8;
  background-image: linear-gradient(
    90deg,
    #f6f7f8 0%,
    #edeef1 20%,
    #f6f7f8 40%,
    #f6f7f8 100%
  );
  background-repeat: no-repeat;
  background-size: 800px 104px;
  display: inline-block;
  position: relative;
  animation: shimmer 1.2s ease-in-out infinite;
  border-radius: 6px;
}

/* ขนาด Skeleton รูปแบบต่างๆ */
.skeleton-img { width: 60px; height: 60px; border-radius: 8px; }
.skeleton-text { width: 100%; height: 16px; margin: 4px 0; }
.skeleton-text-sm { width: 60%; height: 14px; }
.skeleton-btn { width: 80px; height: 32px; border-radius: 6px; }</style>
<body class="bg-light">

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold text-danger mb-0">🍱 จัดการเมนูอาหาร</h2>
                <small class="text-muted">ร้านข้าวกล่องไอคุน - แผงควบคุมผู้ดูแลระบบ</small>
            </div>
            <button class="btn btn-danger" onclick="openAddModal()">
                <i class="bi bi-plus-lg me-1"></i> เพิ่มเมนูใหม่
            </button>
        </div>

        <!-- ตารางแสดงรายการเมนู -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 80px;">รูปภาพ</th>
                                <th>ชื่อเมนู</th>
                                <th>หมวดหมู่</th>
                                <th>ราคา (บาท)</th>
                                <th>สถานะการขาย</th>
                                <th class="text-center" style="width: 150px;">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="menuTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4">กำลังโหลดข้อมูล...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เพิ่ม / แก้ไข เมนู -->
    <div class="modal fade" id="menuModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle">เพิ่มเมนูใหม่</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="menuForm" onsubmit="handleFormSubmit(event)">
                    <div class="modal-body">
                        <input type="hidden" id="menuId">
                        
                        <div class="mb-3">
                            <label class="form-label">ชื่อเมนูอาหาร <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="menuName" required placeholder="เช่น ข้าวผัดกระเพราไก่">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">ราคา (บาท) <span class="text-danger">*</span></label>
                                <input type="number" step="0.5" class="form-control" id="menuPrice" required placeholder="50">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">หมวดหมู่ <span class="text-danger">*</span></label>
                                <select class="form-select" id="menuCategory" required>
                                    <option value="อาหารจานเดียว">อาหารจานเดียว</option>
                                    <option value="กับข้าว">กับข้าว</option>
                                    <option value="เครื่องดื่ม">เครื่องดื่ม</option>
                                    <option value="ของทานเล่น">ของทานเล่น</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">รูปภาพเมนู</label>
                            <input type="file" class="form-control" id="menuImage" accept="image/*">
                            <small class="text-muted">หากไม่เปลี่ยนรูปตอนแก้ไข ให้เว้นว่างไว้</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                        <button type="submit" class="btn btn-danger" id="submitBtn">บันทึกข้อมูล</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let menusData = [];
        const menuModal = new bootstrap.Modal(document.getElementById('menuModal'));

        // โหลดเมนูทั้งหมดเมื่อเปิดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', fetchMenus);

        async function fetchMenus() {
            try {
                const res = await fetch('/api/admin/menus');
                const data = await res.json();
                if (data.success) {
                    menusData = data.data;
                    renderTable(menusData);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('menuTableBody').innerHTML = 
                    `<tr><td colspan="6" class="text-center text-danger py-4">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
            }
        }

        // แสดงผลรายการในตาราง
        function renderTable(menus) {
            const tbody = document.getElementById('menuTableBody');
            if (menus.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4">ยังไม่มีข้อมูลเมนูอาหาร</td></tr>`;
                return;
            }

            tbody.innerHTML = menus.map(item => `
                <tr>
                    <td>
                        <img src="${item.image_url || 'https://via.placeholder.com/60?text=No+Image'}" 
                             class="rounded" style="width: 50px; height: 50px; object-fit: cover;">
                    </td>
                    <td class="fw-bold">${item.name}</td>
                    <td><span class="badge bg-secondary">${item.category || 'ทั่วไป'}</span></td>
                    <td>${item.price.toFixed(2)}</td>
                    <td>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" 
                                   ${item.is_available ? 'checked' : ''} 
                                   onchange="toggleStatus('${item.id}', this.checked)">
                            <label class="form-check-label">
                                ${item.is_available ? '<span class="text-success">พร้อมขาย</span>' : '<span class="text-muted">หมด</span>'}
                            </label>
                        </div>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal('${item.id}')">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteMenu('${item.id}')">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // เปิด Modal เพิ่มเมนู
        function openAddModal() {
            document.getElementById('menuId').value = '';
            document.getElementById('menuForm').reset();
            document.getElementById('modalTitle').innerText = 'เพิ่มเมนูใหม่';
            menuModal.show();
        }

        // เปิด Modal แก้ไขเมนู
        function openEditModal(id) {
            const menu = menusData.find(m => m.id === id);
            if (!menu) return;

            document.getElementById('menuId').value = menu.id;
            document.getElementById('menuName').value = menu.name;
            document.getElementById('menuPrice').value = menu.price;
            document.getElementById('menuCategory').value = menu.category || 'อาหารจานเดียว';
            document.getElementById('menuImage').value = '';
            document.getElementById('modalTitle').innerText = 'แก้ไขเมนู';
            menuModal.show();
        }

        // ส่งข้อมูล Form (ทั้งเพิ่มและแก้ไข)
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('menuId').value;
            const formData = new FormData();
            
            formData.append('name', document.getElementById('menuName').value);
            formData.append('price', document.getElementById('menuPrice').value);
            formData.append('category', document.getElementById('menuCategory').value);
            
            const imageFile = document.getElementById('menuImage').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            const url = id ? `/api/admin/menus/${id}` : '/api/admin/menus';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, { method: method, body: formData });
                const result = await res.json();
                
                if (result.success) {
                    menuModal.hide();
                    Swal.fire('สำเร็จ!', result.message, 'success');
                    fetchMenus();
                } else {
                    Swal.fire('ผิดพลาด!', result.error, 'error');
                }
            } catch (err) {
                Swal.fire('ผิดพลาด!', 'เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            }
        }

        // เปิด/ปิด การขายเมนู
        async function toggleStatus(id, isAvailable) {
            try {
                const res = await fetch(`/api/admin/menus/${id}/toggle-status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_available: isAvailable })
                });
                const result = await res.json();
                if (!result.success) {
                    Swal.fire('ผิดพลาด!', result.error, 'error');
                    fetchMenus();
                }
            } catch (err) {
                Swal.fire('ผิดพลาด!', 'ไม่สามารถเปลี่ยนสถานะได้', 'error');
                fetchMenus();
            }
        }

        // ลบเมนู
        async function deleteMenu(id) {
            const confirm = await Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "หากลบแล้วจะไม่สามารถกู้คืนข้อมูลได้",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'ลบเมนู',
                cancelButtonText: 'ยกเลิก'
            });

            if (confirm.isConfirmed) {
                try {
                    const res = await fetch(`/api/admin/menus/${id}`, { method: 'DELETE' });
                    const result = await res.json();
                    if (result.success) {
                        Swal.fire('ลบเรียบร้อย!', result.message, 'success');
                        fetchMenus();
                    }
                } catch (err) {
                    Swal.fire('ผิดพลาด!', 'เกิดข้อผิดพลาดในการลบข้อมูล', 'error');
                }
            }
        }
    </script>
</body>
</html>
