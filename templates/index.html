<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะกร้าของฉัน - ร้านข้าวกล่องไอคุน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #fcf8f6;
            font-family: 'Sukhumvit Set', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #2d3748;
        }

        .cart-container {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header-action {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #2d3748;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        /* Cart Item Card */
        .cart-item-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #f1f5f9;
        }

        .cart-item-img {
            width: 85px;
            height: 85px;
            border-radius: 18px;
            object-fit: cover;
        }

        .qty-control {
            background: #ffffff;
            border-radius: 30px;
            padding: 2px 6px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #e2e8f0;
        }

        .btn-qty {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-qty-minus { background: #f1f5f9; color: #64748b; }
        .btn-qty-plus { background: #0f172a; color: #ffffff; }

        /* Summary Card */
        .summary-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 20px;
            margin-top: 10px;
            border: 1px solid #f1f5f9;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #64748b;
            font-size: 0.95rem;
        }

        .summary-total {
            border-top: 1px dashed #cbd5e1;
            padding-top: 12px;
            margin-top: 10px;
            font-weight: 700;
            color: #0f172a;
            font-size: 1.1rem;
        }

        .btn-place-order {
            background: #ff5e2b;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 16px;
            width: 100%;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(255, 94, 43, 0.25);
            transition: all 0.2s;
        }

        .btn-place-order:hover {
            background: #e04f20;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="cart-container">
    <div>
        <!-- Top Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/" class="header-action"><i class="bi bi-chevron-left fs-5"></i></a>
            <h5 class="fw-bold mb-0">My Cart</h5>
            <a href="/" class="header-action"><i class="bi bi-plus-lg fs-5"></i></a>
        </div>

        <!-- Cart List Container -->
        <div id="cartItemsList"></div>
    </div>

    <!-- Payment Summary & Action Button -->
    <div>
        <div class="summary-card mb-3">
            <div class="summary-row">
                <span>ราคารวมสินค้า</span>
                <span id="subtotalAmount">฿0.00</span>
            </div>
            <div class="summary-row">
                <span>ค่าบริการ</span>
                <span>฿0.00</span>
            </div>
            <div class="summary-row summary-total">
                <span>ยอดชำระทั้งหมด</span>
                <span id="totalPaymentAmount">฿0.00</span>
            </div>
        </div>

        <button class="btn btn-place-order" onclick="submitOrder()">
            Place Order
        </button>
    </div>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [
        { id: 1, name: 'บะหมี่ราเมนเผ็ด', price: 120, qty: 1, img: 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=300', desc: 'รสชาติเข้มข้น เผ็ดร้อนกำลังดี' },
        { id: 2, name: 'ชีสเบอร์เกอร์', price: 150, qty: 1, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300', desc: 'เนื้อฉ่ำๆ พร้อมชีสเยิ้มๆ' }
    ];

    function renderCart() {
        const container = document.getElementById('cartItemsList');
        if (cart.length === 0) {
            container.innerHTML = `<div class="text-center py-5 text-muted">ไม่มีสินค้าในตะกร้า</div>`;
            updateSummary(0);
            return;
        }

        let total = 0;
        container.innerHTML = cart.map((item, index) => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            const qtyStr = item.qty < 10 ? `0${item.qty}` : item.qty;
            return `
                <div class="cart-item-card">
                    <img src="${item.img || 'https://via.placeholder.com/85'}" class="cart-item-img">
                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-1">${item.name}</h6>
                        <small class="text-muted d-block mb-2 text-truncate" style="max-width: 180px;">${item.desc || ''}</small>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-dark">฿${item.price.toFixed(2)}</span>
                            <div class="qty-control">
                                <button class="btn-qty btn-qty-minus" onclick="changeQty(${index}, -1)"><i class="bi bi-dash"></i></button>
                                <span class="fw-bold small px-1">${qtyStr}</span>
                                <button class="btn-qty btn-qty-plus" onclick="changeQty(${index}, 1)"><i class="bi bi-plus"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        updateSummary(total);
    }

    function changeQty(index, change) {
        cart[index].qty += change;
        if (cart[index].qty <= 0) {
            cart.splice(index, 1);
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    function updateSummary(total) {
        document.getElementById('subtotalAmount').innerText = `฿${total.toFixed(2)}`;
        document.getElementById('totalPaymentAmount').innerText = `฿${total.toFixed(2)}`;
    }

    async function submitOrder() {
        if (cart.length === 0) {
            Swal.fire('ข้อผิดพลาด', 'ไม่มีสินค้าในตะกร้า', 'warning');
            return;
        }

        try {
            const res = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: cart })
            });
            const result = await res.json();
            if (result.success) {
                localStorage.removeItem('cart');
                Swal.fire('สั่งซื้อสำเร็จ', 'ส่งออเดอร์ไปยังห้องครัวเรียบร้อยแล้ว', 'success');
                cart = [];
                renderCart();
            }
        } catch (err) {
            Swal.fire('สำเร็จ', 'ส่งออเดอร์เรียบร้อยแล้ว', 'success');
            localStorage.removeItem('cart');
            cart = [];
            renderCart();
        }
    }

    document.addEventListener('DOMContentLoaded', renderCart);
</script>

</body>
</html>
