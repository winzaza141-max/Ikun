<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งอาหาร - ร้านข้าวกล่องไอคุน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { padding-bottom: 90px; }
        .menu-img { height: 140px; object-fit: cover; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; }
    </style>
</head>
<body class="bg-light">

    <!-- Header -->
    <nav class="navbar navbar-dark bg-danger sticky-top shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">🍱 ข้าวกล่องไอคุน</span>
            <span class="badge bg-white text-danger fs-6" id="tableDisplay">โต๊ะ {{ table_num }}</span>
        </div>
    </nav>

    <div class="container py-3">
        <!-- ตัวเลือกหมวดหมู่ -->
       <!-- ตัวเลือกหมวดหมู่ -->
        <div class="d-flex overflow-auto gap-2 mb-3 pb-2" id="categoryFilter">
            <button class="btn btn-danger btn-sm rounded-pill px-3 active" onclick="filterCategory('ทั้งหมด', this)">ทั้งหมด</button>
            <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="filterCategory('อาหารจานเดียว', this)">อาหารจานเดียว</button>
            <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="filterCategory('กับข้าว', this)">กับข้าว</button>
            <button class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="filterCategory('เครื่องดื่ม', this)">เครื่องดื่ม</button>
        </div>

        <!-- รายการเมนู -->
        <div class="row g-3" id="menuContainer">
            <div class="text-center py-5 text-muted">กำลังโหลดเมนูอาหาร...</div>
        </div>
    </div>

    <!-- แถบตะกร้าสินค้าด้านล่าง (Fixed Bottom Bar) -->
    <div class="cart-bar bg-white border-top shadow-lg p-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <small class="text-muted d-block">รวมทั้งหมด (<span id="cartCount">0</span> รายการ)</small>
                <span class="fs-4 fw-bold text-danger" id="cartTotal">0.00</span> <small>บาท</small>
            </div>
            <button class="btn btn-danger btn-lg px-4 fw-bold" onclick="openCartModal()">
                <i class="bi bi-cart-fill me-1"></i> ดูตะกร้า
            </button>
        </div>
    </div>

    <!-- Modal ตะกร้าสินค้า -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-cart3 me-2"></i>รายการที่สั่ง (โต๊ะ <span id="modalTableNum"></span>)</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="cartItemList" class="mb-3">
                        <!-- รายการในตะกร้าจะถูกแทรกที่นี่ -->
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span>ราคารวมทั้งหมด:</span>
                        <span class="text-danger"><span id="modalCartTotal">0.00</span> บาท</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">เลือกอาหารเพิ่ม</button>
                    <button type="button" class="btn btn-danger px-4" onclick="submitOrder()">ยืนยันการสั่งอาหาร</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const tableNum = "{{ table_num }}";
        document.getElementById('modalTableNum').innerText = tableNum;

        let allMenus = [];
        let cart = []; // [{id, name, price, qty}]
        const cartModal = new bootstrap.Modal(document.getElementById('cartModal'));

        // โหลดเมนูจาก Server
        document.addEventListener('DOMContentLoaded', fetchMenus);

        async function fetchMenus() {
            try {
                const res = await fetch('/api/menus');
                const result = await res.json();
                if (result.success) {
                    allMenus = result.data;
                    renderMenus(allMenus);
                }
            } catch (err) {
                document.getElementById('menuContainer').innerHTML = 
                    `<div class="text-center text-danger py-5">เกิดข้อผิดพลาดในการโหลดเมนู</div>`;
            }
        }

        // แสดงผลเมนู
        function renderMenus(menus) {
            const container = document.getElementById('menuContainer');
            if (menus.length === 0) {
                container.innerHTML = `<div class="text-center py-5 text-muted">ไม่มีเมนูอาหารในหมวดหมู่นี้</div>`;
                return;
            }

            container.innerHTML = menus.map(item => `
                <div class="col-6 col-md-4 col-lg-3">
                    <div class="card h-100 border-0 shadow-sm rounded-3 overflow-hidden">
                        <img src="${item.image_url || 'https://via.placeholder.com/300x200?text=Ikun+Food'}" class="card-img-top menu-img">
                        <div class="card-body p-2 d-flex flex-column justify-content-between">
                            <div>
                                <h6 class="card-title fw-bold mb-1 text-truncate">${item.name}</h6>
                                <p class="text-danger fw-bold mb-2">${item.price.toFixed(2)} ฿</p>
                            </div>
                            <button class="btn btn-sm btn-outline-danger w-100 rounded-pill" onclick="addToCart('${item.id}', '${item.name}', ${item.price})">
                                + เพิ่มลงตะกร้า
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // กรองหมวดหมู่
        // กรองหมวดหมู่ + อัปเดต UI ปุ่มที่เลือก
        function filterCategory(cat, btnElement) {
            // 1. กรองข้อมูลเมนู
            if (cat === 'ทั้งหมด') {
                renderMenus(allMenus);
            } else {
                const filtered = allMenus.filter(m => m.category === cat);
                renderMenus(filtered);
            }

            // 2. ปรับ Style ของปุ่ม ให้ปุ่มที่ถูกเลือกกลายเป็นสีเข้ม (btn-danger)
            if (btnElement) {
                // ลบ class สีเข้ม ออกจากทุกปุ่ม แล้วคืนค่าเป็นปุ่มเส้นขอบ (btn-outline-danger)
                const buttons = document.querySelectorAll('#categoryFilter button');
                buttons.forEach(btn => {
                    btn.classList.remove('btn-danger', 'active');
                    btn.classList.add('btn-outline-danger');
                });

                // ใส่ class สีเข้ม ให้กับปุ่มที่เพิ่งถูกคลิก
                btnElement.classList.remove('btn-outline-danger');
                btnElement.classList.add('btn-danger', 'active');
            }
        }

        // เพิ่มของลงตะกร้า
        function addToCart(id, name, price) {
            const index = cart.findIndex(item => item.id === id);
            if (index > -1) {
                cart[index].qty += 1;
            } else {
                cart.push({ id, name, price, qty: 1 });
            }
            updateCartBar();
            
            // Toast แจ้งเตือนเบาๆ
            const Toast = Swal.mixin({
                toast: true, position: 'top-end', showConfirmButton: false, timer: 1000
            });
            Toast.fire({ icon: 'success', title: `เพิ่ม ${name} แล้ว` });
        }

        // อัปเดตตัวเลขบนแถบด้านล่าง
        function updateCartBar() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('cartCount').innerText = totalQty;
            document.getElementById('cartTotal').innerText = totalPrice.toFixed(2);
            document.getElementById('modalCartTotal').innerText = totalPrice.toFixed(2);
        }

        // เปิดดูตะกร้า
        function openCartModal() {
            if (cart.length === 0) {
                Swal.fire('ตะกร้าว่างเปล่า', 'กรุณาเลือกอาหารก่อนครับ', 'info');
                return;
            }

            const listContainer = document.getElementById('cartItemList');
            listContainer.innerHTML = cart.map((item, index) => `
                <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
                    <div>
                        <div class="fw-bold">${item.name}</div>
                        <small class="text-muted">${item.price} x ${item.qty} = ${(item.price * item.qty).toFixed(2)} ฿</small>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQty(${index}, -1)">-</button>
                        <span class="fw-bold">${item.qty}</span>
                        <button class="btn btn-sm btn-outline-secondary px-2" onclick="changeQty(${index}, 1)">+</button>
                    </div>
                </div>
            `).join('');

            cartModal.show();
        }

        // เพิ่ม/ลด จำนวนในตะกร้า
        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartBar();
            if (cart.length === 0) {
                cartModal.hide();
            } else {
                openCartModal();
            }
        }

        // ส่ง Order ไปยัง Backend
        async function submitOrder() {
            if (cart.length === 0) return;

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        table_number: tableNum,
                        items: cart,
                        total_price: totalPrice
                    })
                });

                const result = await res.json();
                if (result.success) {
                    cartModal.hide();
                    cart = []; // ล้างตะกร้า
                    updateCartBar();
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'ส่งคำสั่งซื้อสำเร็จ!',
                        text: 'ทางร้านกำลังเตรียมอาหารให้คุณครับ',
                        confirmButtonColor: '#dc3545'
                    });
                } else {
                    Swal.fire('เกิดข้อผิดพลาด', result.error, 'error');
                }
            } catch (err) {
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถส่งคำสั่งซื้อได้ กรุณาลองใหม่', 'error');
            }
        }
    </script>
</body>
</html>
